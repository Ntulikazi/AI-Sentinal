name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and validation dependencies
        run: python -m pip install -e ".[test,quality]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Scanner and retest regression checks
        run: python -m pytest tests/test_scanners.py tests/test_retesting_api.py tests/test_evaluations_api.py -q
      - name: Full unit and integration suite
        run: python -m pytest -q
      - name: Compile source and tests
        run: python -m compileall -q apps src tests
      - name: Check dependency consistency
        run: python -m pip check
